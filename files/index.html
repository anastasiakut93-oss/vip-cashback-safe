<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Файлы анимации сейфа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --page: #1B1D21; --card: #292D32; --w8: rgba(255,255,255,.08); --w48: rgba(255,255,255,.48); --w64: rgba(255,255,255,.64); --w88: rgba(255,255,255,.88); --gold: #EBBC5E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--w88); font: 14px/20px Inter, system-ui, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 24px; line-height: 32px; margin: 0 0 4px; color: #fff; }
  .sub { color: var(--w64); margin: 0 0 24px; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 12px; font-size: 18px; line-height: 24px; color: #fff; }
  .preview { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .preview video, .preview img { width: 80px; height: 80px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--w8); }
  th { color: var(--w48); font-weight: 500; font-size: 12px; }
  td.r, th.r { text-align: right; }
  .muted { color: var(--w48); font-size: 12px; line-height: 16px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Файлы анимации сейфа</h1>
  <p class="sub">Анимация «Открытие», 2,3&nbsp;с, 30&nbsp;к/с, прозрачный фон. @2x подходит для иконки 80&nbsp;px. <a href="../">Вернуться к модалкам</a></p>
  <div class="grid">
    <div class="card" data-brand="fonbet">
      <h2>Fonbet</h2>
      <div class="preview"></div>
      <table></table>
    </div>
    <div class="card" data-brand="pari">
      <h2>Pari</h2>
      <div class="preview"></div>
      <table></table>
    </div>
  </div>
  <p class="muted">WebM играет в Chrome, Firefox, Edge и на Android. HEVC (.mov) для Safari и iOS. WebP подходит везде одним файлом, но весит больше.</p>
</div>
<script>
  const SIZES = { fonbet: { webm: [51, 83, 117], mov: [102, 169, 236], webp: [212, 365, 512] },
                  pari: { webm: [51, 82, 118], mov: [97, 159, 224], webp: [193, 343, 483] } };
  const X = ['2x', '3x', '4x'];
  const KIND = [['webm', 'WebM', x => `safe-open@${x}.webm`], ['mov', 'HEVC', x => `safe-open@${x}-hevc.mov`], ['webp', 'WebP', x => `safe-open@${x}.webp`]];
  document.querySelectorAll('.card').forEach(card => {
    const b = card.dataset.brand;
    card.querySelector('.preview').innerHTML =
      `<video autoplay muted playsinline loop aria-label="Превью анимации">
         <source src="${b}/safe-open@2x-hevc.mov" type='video/mp4; codecs="hvc1"'>
         <source src="${b}/safe-open@2x.webm" type="video/webm">
       </video><span class="muted" style="margin:0">Превью 80&nbsp;px, @2x</span>`;
    card.querySelector('table').innerHTML = `<tr><th>Формат</th>${X.map(x => `<th class="r">@${x}</th>`).join('')}</tr>` +
      KIND.map(([k, label, name]) => `<tr><td>${label}</td>${X.map((x, i) =>
        `<td class="r"><a href="${b}/${name(x)}" download>${SIZES[b][k][i]}&nbsp;КБ</a></td>`).join('')}</tr>`).join('');
  });
</script>
</body>
</html>
